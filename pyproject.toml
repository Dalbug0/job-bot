[tool.black]
line-length = 79
target-version = ["py311"]
exclude = '''
(
    \.venv
  | venv
  | __pycache__
  | migrations
  | \.pytest_cache
  | \.ruff_cache
  | \.mypy_cache
  | htmlcov
)
'''


[tool.isort]
profile = "black"
line_length = 79
skip_glob = ["migrations/*"]
skip = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "htmlcov",
]

[tool.ruff]
fix = true
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "htmlcov",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.flake8]
max-line-length = 79
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "htmlcov",
]
